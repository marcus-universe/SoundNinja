name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.4.0). Leave empty to use src-tauri/tauri.conf.json."
        required: false
        type: string
      update_aur:
        description: "DISABLED — AUR deploy off until account/secrets exist. Leave false."
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 → NSIS installer
          # `--features stems` enables BS-RoFormer / ONNX Runtime stem engine
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            cache_key: windows-x64
            args: "--target x86_64-pc-windows-msvc --bundles nsis -- --features stems"

          # Linux x64 → .deb + AppImage (AppImage feeds AUR package)
          # ubuntu-24.04: cpal/rodio pipewire → libspa 0.10 needs PipeWire ≥ 1.0
          # headers (22.04 ships 0.3.48 → E0425/E0560 on spa_meta_* / video flags).
          - platform: ubuntu-24.04
            rust_targets: x86_64-unknown-linux-gnu
            cache_key: linux-x64
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage -- --features stems"

          # macOS: one leg per arch instead of `universal-apple-darwin`. The
          # universal target compiles both arches back to back inside a single
          # job, which made macOS the critical path; split, they run in parallel.
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin
            cache_key: macos-arm64
            args: "--target aarch64-apple-darwin --bundles dmg -- --features stems"

          # macos-13 retired Dec 2025 — GitHub never rejects the label, job
          # queues forever. macos-15-intel is the last hosted x86_64 image
          # (gone Fall 2027). See actions/runner-images#13046.
          - platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            cache_key: macos-x64
            args: "--target x86_64-apple-darwin --bundles dmg -- --features stems"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Without this every release recompiled ~760 crates from scratch, which
      # was the single biggest chunk of the 15-20 minute build.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.cache_key }}-stems
          cache-on-failure: true

      # Covers the case rust-cache cannot: a changed Cargo.lock invalidates the
      # target directory, but individual crate compilations are still cache hits.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Route rustc through sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            mold

      # `lto = true` makes linking the slow part of a release build; mold cuts
      # it to a fraction. Windows/macOS use rust-lld via .cargo/config.toml.
      - name: Use mold as linker
        if: matrix.platform == 'ubuntu-24.04'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            TAG="v${VER}"
          else
            TAG="v__VERSION__"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tagName=$TAG"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: add repo secret TAURI_SIGNING_PRIVATE_KEY (minisign private key
          # matching plugins.updater.pubkey) then set createUpdaterArtifacts true.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Force npm — repo has pnpm-lock.yaml/bun.lock which otherwise make the action pick pnpm/bun
          tauriScript: npm run tauri
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Sound Ninja ${{ steps.meta.outputs.tag }}"
          releaseBody: |
            Draft release — review assets below, then publish when ready.

            **Downloads**
            - Windows: `.exe` installer
            - macOS: `.dmg` for Apple Silicon and for Intel
            - Linux: `.deb` (Ubuntu/Debian) and `.AppImage`

            In-app updates use signed updater artifacts + `latest.json` (see `docs/updater.md`).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  aliases:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            TAG="v${VER}"
          else
            VER="$(jq -r .version src-tauri/tauri.conf.json)"
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG"

      - name: Upload stable installer aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p aliases
          cd aliases
          gh release download "$TAG" --pattern "soundninja_*" || true
          shopt -s nullglob
          upload=()
          for f in *_x64-setup.exe; do
            cp "$f" soundninja-windows-x64-setup.exe
            upload+=(soundninja-windows-x64-setup.exe)
          done
          for f in *_aarch64.dmg; do
            cp "$f" soundninja-macos-arm64.dmg
            upload+=(soundninja-macos-arm64.dmg)
          done
          for f in *_x64.dmg; do
            cp "$f" soundninja-macos-x64.dmg
            upload+=(soundninja-macos-x64.dmg)
          done
          for f in *_amd64.deb; do
            cp "$f" soundninja-linux-amd64.deb
            upload+=(soundninja-linux-amd64.deb)
          done
          for f in *_amd64.AppImage; do
            cp "$f" soundninja-linux-amd64.AppImage
            upload+=(soundninja-linux-amd64.AppImage)
          done
          if [ ${#upload[@]} -eq 0 ]; then
            echo "::warning::No installer assets found to alias"
            exit 0
          fi
          gh release upload "$TAG" "${upload[@]}" --clobber

  # AUR deploy disabled — maintainer not registered on AUR yet.
  # Re-enable when AUR_USERNAME / AUR_EMAIL / AUR_SSH_PRIVATE_KEY secrets exist:
  # restore the `if:` below (tag push or workflow_dispatch update_aur).
  aur-update:
    needs: build
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "AUR pkgver=$VERSION"

      - name: Bump PKGBUILD pkgver
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

      - name: Update AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: soundninja-bin
          pkgbuild: ./aur/PKGBUILD
          assets: ./aur/soundninja.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.VERSION }}"
          updpkgsums: true
