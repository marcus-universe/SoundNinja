name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.8.0). Leave empty to use src-tauri/tauri.conf.json. Creates a draft if none exists."
        required: false
        type: string
      update_aur:
        description: "Push PKGBUILD to AUR (needs AUR_SSH_PRIVATE_KEY + AUR account)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      windows: ${{ steps.need.outputs.windows }}
      linux: ${{ steps.need.outputs.linux }}
      linux_arm64: ${{ steps.need.outputs.linux_arm64 }}
      linux_armhf: ${{ steps.need.outputs.linux_armhf }}
      macos_arm: ${{ steps.need.outputs.macos_arm }}
      macos_intel: ${{ steps.need.outputs.macos_intel }}
      aur: ${{ steps.need.outputs.aur }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require release draft
        id: draft
        uses: ./.github/actions/require-release-draft
        with:
          version: ${{ inputs.version }}

      - name: Decide missing platforms
        id: need
        env:
          ASSETS: ${{ steps.draft.outputs.assets }}
        shell: bash
        run: |
          set -euo pipefail

          has() {
            local pat="$1"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              # Intentional glob: callers pass patterns like soundninja-aur-*.tar.gz
              # shellcheck disable=SC2254
              case "$name" in
                $pat) return 0 ;;
              esac
            done <<<"$ASSETS"
            return 1
          }

          windows=true
          if has 'soundninja-windows-x64-setup.exe'; then
            windows=false
          fi

          linux=true
          if has 'soundninja-linux-amd64.deb' && has 'soundninja-linux-amd64.AppImage'; then
            linux=false
          fi

          linux_arm64=true
          if has 'soundninja-linux-arm64.deb' && has 'soundninja-linux-arm64.AppImage'; then
            linux_arm64=false
          fi

          linux_armhf=true
          if has 'soundninja-linux-armhf.deb'; then
            linux_armhf=false
          fi

          macos_arm=true
          if has 'soundninja-macos-arm64.dmg'; then
            macos_arm=false
          fi

          macos_intel=true
          if has 'soundninja-macos-x64.dmg'; then
            macos_intel=false
          fi

          aur=true
          if has 'soundninja-aur-*.tar.gz' || has 'soundninja-bin-*-x86_64.pkg.tar.zst'; then
            aur=false
          fi
          # glob in has() uses case, so soundninja-aur-*.tar.gz works

          {
            echo "windows=$windows"
            echo "linux=$linux"
            echo "linux_arm64=$linux_arm64"
            echo "linux_armhf=$linux_armhf"
            echo "macos_arm=$macos_arm"
            echo "macos_intel=$macos_intel"
            echo "aur=$aur"
          } >> "$GITHUB_OUTPUT"

          echo "Draft ${{ steps.draft.outputs.tag }}"
          echo "windows=$windows linux=$linux linux_arm64=$linux_arm64 linux_armhf=$linux_armhf aur=$aur macos_arm=$macos_arm macos_intel=$macos_intel"
          if [ -n "$ASSETS" ]; then
            echo "Existing assets:"
            printf '%s\n' "$ASSETS"
          else
            echo "Draft has no assets yet"
          fi

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true' || needs.plan.outputs.linux_arm64 == 'true' || needs.plan.outputs.linux_armhf == 'true' || needs.plan.outputs.aur == 'true'
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ inputs.version }}
      build_x64: ${{ fromJSON(needs.plan.outputs.linux) }}
      build_arm64: ${{ fromJSON(needs.plan.outputs.linux_arm64) }}
      build_armhf: ${{ fromJSON(needs.plan.outputs.linux_armhf) }}
      publish: true
    secrets: inherit

  macos-arm:
    needs: plan
    if: needs.plan.outputs.macos_arm == 'true'
    uses: ./.github/workflows/release-macos-arm.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  macos-intel:
    needs: plan
    if: needs.plan.outputs.macos_intel == 'true'
    uses: ./.github/workflows/release-macos-intel.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  aur-update:
    needs: [plan, linux]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_aur && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require AUR SSH key
        id: aurcheck
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY unset. Run scripts/setup-secrets.ps1 -GenerateAurSsh -Push"
            exit 1
          fi

      - name: Download AUR bundle
        uses: actions/download-artifact@v4
        with:
          name: aur
          path: aur-dist

      - name: Unpack AUR sources
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(aur-dist/soundninja-aur-*.tar.gz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::error::No soundninja-aur-*.tar.gz in artifact"
            exit 1
          fi
          mkdir -p aur-publish
          tar -xzf "${tarballs[0]}" -C aur-publish
          ls -la aur-publish

      - name: Update AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: soundninja-bin
          pkgbuild: ./aur-publish/PKGBUILD
          assets: |
            ./aur-publish/LICENSE
            ./aur-publish/REUSE.toml
            ./aur-publish/GPL-3.0-only.txt
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.plan.outputs.tag }}"
          updpkgsums: false
