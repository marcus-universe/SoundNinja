name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.7.0). Leave empty to use src-tauri/tauri.conf.json. Draft must already exist."
        required: false
        type: string
      update_aur:
        description: "DISABLED — AUR deploy off until account/secrets exist. Leave false."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      windows: ${{ steps.need.outputs.windows }}
      linux: ${{ steps.need.outputs.linux }}
      macos_arm: ${{ steps.need.outputs.macos_arm }}
      macos_intel: ${{ steps.need.outputs.macos_intel }}
      companion: ${{ steps.need.outputs.companion }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require release draft
        id: draft
        uses: ./.github/actions/require-release-draft
        with:
          version: ${{ inputs.version }}

      - name: Decide missing platforms
        id: need
        env:
          ASSETS: ${{ steps.draft.outputs.assets }}
        shell: bash
        run: |
          set -euo pipefail

          has() {
            local pat="$1"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              case "$name" in
                $pat) return 0 ;;
              esac
            done <<<"$ASSETS"
            return 1
          }

          windows=true
          if has '*x64-setup.exe' || has 'soundninja-windows-x64-setup.exe'; then
            windows=false
          fi

          linux=true
          if { has '*_amd64.deb' || has 'soundninja-linux-amd64.deb'; } \
             && { has '*_amd64.AppImage' || has 'soundninja-linux-amd64.AppImage'; }; then
            linux=false
          fi

          macos_arm=true
          if has '*_aarch64.dmg' || has 'soundninja-macos-arm64.dmg'; then
            macos_arm=false
          fi

          macos_intel=true
          if has '*_x64.dmg' || has 'soundninja-macos-x64.dmg'; then
            macos_intel=false
          fi

          companion=true
          if has 'SoundNinja-Companion.tgz' || has 'SoundNinja-Companion-*.tgz'; then
            companion=false
          fi

          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "macos_arm=$macos_arm" >> "$GITHUB_OUTPUT"
          echo "macos_intel=$macos_intel" >> "$GITHUB_OUTPUT"
          echo "companion=$companion" >> "$GITHUB_OUTPUT"

          echo "Draft ${{ steps.draft.outputs.tag }}"
          echo "windows=$windows linux=$linux macos_arm=$macos_arm macos_intel=$macos_intel companion=$companion"
          if [ -n "$ASSETS" ]; then
            echo "Existing assets:"
            printf '%s\n' "$ASSETS"
          else
            echo "Draft has no assets yet"
          fi

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  macos-arm:
    needs: plan
    if: needs.plan.outputs.macos_arm == 'true'
    uses: ./.github/workflows/release-macos-arm.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  macos-intel:
    needs: plan
    if: needs.plan.outputs.macos_intel == 'true'
    uses: ./.github/workflows/release-macos-intel.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  companion:
    needs: plan
    if: needs.plan.outputs.companion == 'true'
    uses: ./.github/workflows/companion-release.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  # AUR deploy disabled — maintainer not registered on AUR yet.
  # Re-enable when AUR_USERNAME / AUR_EMAIL / AUR_SSH_PRIVATE_KEY secrets exist.
  aur-update:
    needs: plan
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "AUR pkgver=$VERSION"

      - name: Bump PKGBUILD pkgver
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

      - name: Update AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: soundninja-bin
          pkgbuild: ./aur/PKGBUILD
          assets: ./aur/soundninja.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.VERSION }}"
          updpkgsums: true
