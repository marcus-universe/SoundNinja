name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.4.0). Leave empty to use src-tauri/tauri.conf.json."
        required: false
        type: string
      update_aur:
        description: "Push PKGBUILD update to AUR (publish the GitHub release first so AppImage URL is public)."
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 → NSIS installer (+ MSI if enabled in bundle targets)
          # `--features stems` enables BS-RoFormer / ONNX Runtime stem engine
          - platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc -- --features stems"

          # Linux x64 → .deb + AppImage (AppImage feeds AUR package)
          - platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu -- --features stems"

          # macOS universal → DMG covering Apple Silicon + Intel
          # rustup has no "universal-apple-darwin" target; install both arches, Tauri lipo merges them
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin --bundles dmg -- --features stems"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev

      # Windows env vars mangle multiline minisign keys → "Missing comment in secret key".
      # Write a key file and prefer TAURI_SIGNING_PRIVATE_KEY_PATH on Windows only.
      - name: Prepare updater signing key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is empty"
            exit 1
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "tauri_signing.key"
          $key = $env:TAURI_SIGNING_PRIVATE_KEY -replace '\\n', "`n"
          [System.IO.File]::WriteAllText($keyPath, $key)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath"
          # Prefer path over env contents on Windows
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY="
          Write-Host "Signing key written ($((Get-Item $keyPath).Length) bytes)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            TAG="v${VER}"
          else
            TAG="v__VERSION__"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tagName=$TAG"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          # Wrong / unexpected password → "Missing comment in secret key". Leave empty if key has none.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Force npm — repo has pnpm-lock.yaml/bun.lock which otherwise make the action pick pnpm/bun
          tauriScript: npm run tauri
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Sound Ninja ${{ steps.meta.outputs.tag }}"
          releaseBody: |
            Draft release — review assets below, then publish when ready.

            **Downloads**
            - Windows: `.exe` / `.msi` installer
            - macOS: universal `.dmg` (Apple Silicon + Intel)
            - Linux: `.deb` (Ubuntu/Debian) and `.AppImage`
            - Arch: install via AUR (`soundninja-bin`) after this release is published

            In-app updates use signed updater artifacts + `latest.json` (see `docs/updater.md`).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  aur-update:
    needs: build
    # Tag pushes always attempt AUR update. Manual runs only when update_aur=true.
    # AppImage must be publicly downloadable — publish the draft release first for manual AUR updates.
    if: >
      always() &&
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.update_aur)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "AUR pkgver=$VERSION"

      - name: Bump PKGBUILD pkgver
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

      - name: Update AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: soundninja-bin
          pkgbuild: ./aur/PKGBUILD
          assets: ./aur/soundninja.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.VERSION }}"
          updpkgsums: true
