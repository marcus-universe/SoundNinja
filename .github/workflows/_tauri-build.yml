# Reusable Tauri platform build. Does not create a GitHub release.
# Caller must pass an existing draft tag when publish=true; this job only builds and uploads.
name: Tauri platform build

on:
  workflow_call:
    inputs:
      tag:
        description: Existing draft tag (e.g. v0.8.0). Empty when publish=false.
        required: false
        type: string
        default: ""
      runner:
        required: true
        type: string
      rust_targets:
        required: true
        type: string
      cache_key:
        required: true
        type: string
      args:
        required: true
        type: string
      kind:
        description: windows | linux-x64 | linux-arm64 | linux-armhf | macos-arm | macos-intel
        required: true
        type: string
      publish:
        description: Upload collected assets to the draft release
        required: false
        type: boolean
        default: true
      cross:
        description: Enable armhf multiarch sysroot (linux-armhf)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ inputs.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && inputs.kind != 'linux-armhf'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            mold \
            xvfb \
            file \
            xdg-utils

      - name: Use mold as linker
        if: runner.os == 'Linux' && inputs.kind != 'linux-armhf'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Install armhf cross toolchain
        if: inputs.kind == 'linux-armhf' || inputs.cross
        run: bash .github/scripts/setup-armhf.sh

      - name: Install LLVM (ASIO bindgen)
        if: inputs.kind == 'windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Fetch Steinberg ASIO SDK
        if: inputs.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          $dest = Join-Path $env:RUNNER_TEMP "asiosdk"
          $urls = @(
            "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip",
            "https://www.steinberg.net/asiosdk"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $ok = $true
              break
            } catch {
              Write-Host "ASIO SDK download failed from $url : $_"
            }
          }
          if (-not $ok) {
            throw "Could not download Steinberg ASIO SDK. Set a runner with CPAL_ASIO_DIR or fix the download URL."
          }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $sdk = Get-ChildItem $dest -Directory | Select-Object -First 1
          if (-not $sdk) { $sdk = Get-Item $dest }
          echo "CPAL_ASIO_DIR=$($sdk.FullName)" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=$env:LLVM_PATH\lib" >> $env:GITHUB_ENV
          Write-Host "CPAL_ASIO_DIR=$($sdk.FullName)"

      - name: Check GPG secret
        id: gpgcheck
        if: inputs.kind == 'linux-x64' || inputs.kind == 'linux-arm64'
        shell: bash
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key (AppImage signing)
        id: gpg
        if: steps.gpgcheck.outputs.has_gpg == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Enable AppImage GPG signing
        if: steps.gpg.outcome == 'success'
        run: |
          fingerprint="${{ secrets.GPG_FINGERPRINT }}"
          if [ -z "$fingerprint" ]; then
            fingerprint="${{ steps.gpg.outputs.fingerprint }}"
          fi
          {
            echo "SIGN=1"
            echo "SIGN_KEY=$fingerprint"
            echo "APPIMAGETOOL_SIGN_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows / ASIO)
        if: inputs.kind == 'windows'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CPAL_ASIO_DIR: ${{ env.CPAL_ASIO_DIR }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
        with:
          tauriScript: npm run tauri
          args: ${{ inputs.args }}

      - name: Build Tauri app
        if: inputs.kind != 'windows'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: ${{ inputs.args }}

      - name: Collect release assets
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          OUT_DIR: dist-upload
        run: bash .github/scripts/collect-release-assets.sh

      - name: Detach-sign collected assets
        if: steps.gpg.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist-upload/*; do
            [ -f "$f" ] || continue
            case "$f" in *.asc) continue ;; esac
            gpg --batch --yes --detach-sign --armor "$f"
            echo "Signed $(basename "$f")"
          done

      - name: Smoke-test Linux packages
        if: startsWith(inputs.kind, 'linux')
        env:
          KIND: ${{ inputs.kind }}
          OUT_DIR: dist-upload
        run: bash .github/scripts/smoke-linux.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kind }}
          path: dist-upload/*
          if-no-files-found: error

      - name: Upload stable installers to draft
        if: inputs.publish && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          KIND: ${{ inputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          upload=(dist-upload/*)
          if [ ${#upload[@]} -eq 0 ]; then
            echo "::error::dist-upload is empty"
            exit 1
          fi
          keep=()
          for f in "${upload[@]}"; do
            keep+=("$(basename "$f")")
          done
          gh release upload "$TAG" "${upload[@]}" --clobber
          echo "Uploaded ${#upload[@]} file(s) to $TAG"

          is_keep() {
            local name="$1"
            local k
            for k in "${keep[@]}"; do
              [ "$name" = "$k" ] && return 0
            done
            return 1
          }

          stale=()
          asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name // empty')"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            is_keep "$name" && continue
            case "$name" in
              *.asc|SHA256SUMS|*.pkg.tar.*|soundninja-aur-*) continue ;;
            esac
            case "$KIND:$name" in
              windows:*x64-setup.exe) stale+=("$name") ;;
              linux-x64:*amd64.deb|linux-x64:*amd64.AppImage|linux-x64:*.AppImage.sig) stale+=("$name") ;;
              linux-arm64:*arm64.deb|linux-arm64:*arm64.AppImage|linux-arm64:*aarch64.AppImage|linux-arm64:*.AppImage.sig) stale+=("$name") ;;
              linux-armhf:*armhf.deb) stale+=("$name") ;;
              macos-arm:*_aarch64.dmg|macos-arm:soundninja-macos-arm64.dmg) stale+=("$name") ;;
              macos-intel:*_x64.dmg|macos-intel:soundninja-macos-x64.dmg) stale+=("$name") ;;
            esac
          done <<<"$asset_names"

          if [ ${#stale[@]} -gt 0 ]; then
            for name in "${stale[@]}"; do
              echo "Delete stale asset $name"
              gh release delete-asset "$TAG" "$name" --yes
            done
          fi
