# Keep Swatinem/rust-cache keys alive (GitHub drops unused caches after 7 days).
name: Cache warm

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            cache_key: linux-x64
            extra: linux-native
            cargo_args: "--target x86_64-unknown-linux-gnu --features stems"
          - runner: ubuntu-22.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            cache_key: linux-arm64
            extra: linux-native
            cargo_args: "--target aarch64-unknown-linux-gnu --features stems"
          - runner: ubuntu-22.04
            rust_targets: armv7-unknown-linux-gnueabihf
            cache_key: linux-armhf
            extra: linux-armhf
            cargo_args: "--target armv7-unknown-linux-gnueabihf"
          - runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            cache_key: windows-x64
            extra: windows
            cargo_args: "--target x86_64-pc-windows-msvc --features stems"
          - runner: macos-latest
            rust_targets: aarch64-apple-darwin
            cache_key: macos-arm64
            extra: none
            cargo_args: "--target aarch64-apple-darwin --features stems"
          - runner: macos-15-intel
            rust_targets: x86_64-apple-darwin
            cache_key: macos-x64
            extra: none
            cargo_args: "--target x86_64-apple-darwin --features stems"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.cache_key }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.extra == 'linux-native'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Install armhf cross toolchain
        if: matrix.extra == 'linux-armhf'
        run: bash .github/scripts/setup-armhf.sh

      - name: Install LLVM (ASIO bindgen)
        if: matrix.extra == 'windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Fetch Steinberg ASIO SDK
        if: matrix.extra == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          $dest = Join-Path $env:RUNNER_TEMP "asiosdk"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $sdk = Get-ChildItem $dest -Directory | Select-Object -First 1
          if (-not $sdk) { $sdk = Get-Item $dest }
          echo "CPAL_ASIO_DIR=$($sdk.FullName)" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=$env:LLVM_PATH\lib" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate frontend
        run: npm run generate

      - name: Warm release cache
        working-directory: src-tauri
        run: cargo build --release --locked ${{ matrix.cargo_args }}
