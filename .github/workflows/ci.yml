name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-linux
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev

      - name: Clippy
        env:
          RUSTFLAGS: ""
        run: cargo clippy --locked -- -D clippy::redundant_clone -D clippy::needless_collect

      - name: Test
        run: cargo test --locked

      - name: Test stems
        run: cargo test --locked --features stems

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
