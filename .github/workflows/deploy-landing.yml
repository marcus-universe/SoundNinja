name: Deploy Landing Page

on:
  push:
    branches:
      - landing-page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm install (not ci): the lockfile is generated by a newer npm than the
      # runner ships, so a strict ci sync check fails on transitive deps.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate static site
        run: npm run generate

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .output/public
          clean: true
