name: Release Companion

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SoundNinja draft tag version (e.g. 0.7.0). Leave empty to use src-tauri/tauri.conf.json. Creates a draft if none exists."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Require release draft
        id: draft
        uses: ./.github/actions/require-release-draft
        with:
          version: ${{ inputs.version }}

  package:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout companion module
        uses: actions/checkout@v5
        with:
          ref: companion-module

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Package module
        run: |
          npm ci
          npm run package
          ls -la *.tgz

      - name: Attach .tgz to release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          VER="$(jq -r .version package.json)"
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "::error::Companion package.json version is empty"
            exit 1
          fi

          TGZ=$(ls soundninja-*.tgz 2>/dev/null | head -1)
          if [ -z "$TGZ" ]; then
            TGZ=$(ls *.tgz 2>/dev/null | head -1)
          fi
          if [ -z "$TGZ" ]; then
            echo "::error::No companion .tgz produced"
            exit 1
          fi

          VERSIONED="SoundNinja-Companion-${VER}.tgz"
          STABLE="SoundNinja-Companion.tgz"
          cp "$TGZ" "$VERSIONED"
          cp "$TGZ" "$STABLE"

          echo "Uploading ${VERSIONED} and ${STABLE} to ${TAG}"
          gh release upload "$TAG" "$VERSIONED" "$STABLE" --clobber
