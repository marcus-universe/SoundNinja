name: Companion Module

on:
  push:
    branches: [companion-module]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.0.1). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout companion-module
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            VER="${VER#companion-v}"
          else
            VER="$(jq -r .version package.json)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Using ${VER}"

      - name: Package module
        run: |
          npm ci
          npm run package
          ls -la *.tgz

      - name: Attach .tgz to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGZ=$(ls soundninja-*.tgz 2>/dev/null | head -1)
          if [ -z "$TGZ" ]; then
            TGZ=$(ls *.tgz 2>/dev/null | head -1)
          fi
          if [ -z "$TGZ" ]; then
            echo "::error::No companion .tgz produced"
            exit 1
          fi
          cp "$TGZ" companion-module-soundninja.tgz

          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ -z "$LATEST" ]; then
            echo "::error::No latest GitHub release to attach to"
            exit 1
          fi
          echo "Uploading companion-module-soundninja.tgz (${{ steps.meta.outputs.version }}) to ${LATEST}"
          gh release upload "$LATEST" companion-module-soundninja.tgz --clobber
