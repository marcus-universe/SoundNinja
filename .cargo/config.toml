# Linker settings. `lto = true` + `codegen-units = 1` in the release profile buy
# runtime speed at the cost of a long link step; a fast linker gives most of
# that time back.
#
# rust-lld ships with the toolchain, so this needs no extra install. On Linux
# mold is used when present (CI installs it); local builds without mold fall
# back to the default linker automatically because the flag lives in the CI
# environment rather than here.

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"
